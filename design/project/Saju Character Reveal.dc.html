<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0; background:#0F172A;}
  ::selection{background:#DBEAFE;}
  @keyframes pv-spin{to{transform:rotate(360deg)}}
  @keyframes pv-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pv-fade{from{opacity:0}to{opacity:1}}
  @keyframes pv-breathe{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
  @keyframes pv-cardin{0%{opacity:0;transform:scale(.94) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}
</style>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ glowStyle }}"></div>

  <sc-if value="{{ searching }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 32px;">
      <div style="position:relative; width:86px; height:86px; margin-bottom:32px;">
        <div style="position:absolute; inset:0; border-radius:999px; background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.14), rgba(255,255,255,0) 70%); animation:pv-breathe 2.8s ease-in-out infinite;"></div>
        <div style="position:absolute; inset:10px; border-radius:999px; border:1.5px solid rgba(255,255,255,.14);"></div>
        <div style="position:absolute; inset:10px; border-radius:999px; border:2px solid transparent; border-top-color:rgba(255,255,255,.72); animation:pv-spin 1.1s linear infinite;"></div>
      </div>
      <div style="font-size:clamp(20px,3.2vw,24px); font-weight:700; letter-spacing:-0.03em; color:#fff; animation:pv-fade .4s ease-out;" key="{{ lineKey }}">{{ line }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative; display:flex; flex-direction:column; align-items:center; width:100%; padding:0 20px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:0.1em; color:rgba(255,255,255,.44); margin-bottom:20px; animation:pv-fade .5s ease-out;">{{ doneLabel }}</div>
      <div style="animation:pv-cardin .6s cubic-bezier(.2,.8,.25,1) both;">
        <dc-import name="Character Card" w="{{ cardW }}" element="{{ me.element }}" yy="{{ me.yy }}" hanja="{{ me.hanja }}" family="{{ me.family }}" family-hanja="{{ me.familyHanja }}" basis="{{ me.basis }}" scene="{{ me.scene }}" hook="{{ me.hook }}" chips="{{ me.chips }}" desc="{{ me.desc }}" shadow="{{ me.shadow }}" hint-size="340px,220px"></dc-import>
      </div>
      <a href="./Saju Home.dc.html" style="font-family:inherit; font-size:16px; font-weight:600; color:#0F172A; background:#fff; text-decoration:none; padding:16px 30px; border-radius:14px; cursor:pointer; margin-top:28px; animation:pv-rise .5s .25s ease-out both;" style-hover="opacity:.9;">시작하기</a>
      <button onClick="{{ replay }}" style="font-family:inherit; font-size:13.5px; font-weight:600; color:rgba(255,255,255,.4); background:transparent; border:none; padding:10px; cursor:pointer; margin-top:10px; animation:pv-fade .6s .4s ease-out both;" style-hover="color:rgba(255,255,255,.7);">다시 보기</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;동진&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;characterKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;갑자&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NEUTRAL = '#0F172A';

class Component extends DCLogic {
  state = { phase: 0, data: null, w: 1200 };

  componentDidMount() {
    import('./characters-60.js')
      .then(m => this.setState({ data: m.CHARACTERS }))
      .catch(e => console.error('character data load failed', e));
    this._r = () => this.setState({ w: window.innerWidth });
    this._r();
    window.addEventListener('resize', this._r);
    this.run();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._r);
    clearTimeout(this._t1); clearTimeout(this._t2);
  }

  run = () => {
    clearTimeout(this._t1); clearTimeout(this._t2);
    this.setState({ phase: 0 });
    this._t1 = setTimeout(() => this.setState({ phase: 1 }), 1100);
    this._t2 = setTimeout(() => this.setState({ phase: 2 }), 2200);
  };

  renderVals() {
    const st = this.state;
    const data = st.data || [];
    const mobile = st.w < 760;
    const name = this.props.name ?? '동진';
    const key = this.props.characterKey ?? '갑자';
    const blank = { element: '목', yy: '양', hanja: '甲子', family: '큰나무형', familyHanja: '甲木', basis: '', scene: '', hook: '', chips: [], desc: '', shadow: '' };
    const me = data.find(c => c.key === key) || blank;
    const phase = st.phase;
    const lines = [name + '님의 사주를 세우고 있어요', '캐릭터를 찾고 있어요'];

    return {
      me,
      searching: phase < 2,
      done: phase >= 2,
      line: lines[Math.min(phase, 1)],
      lineKey: 'line-' + Math.min(phase, 1),
      doneLabel: name + '님의 사주 캐릭터',
      cardW: mobile ? Math.min(st.w - 40, 370) : 470,
      replay: this.run,
      wrapStyle: 'position:relative; min-height:100vh; background:' + NEUTRAL + '; display:flex; align-items:center; justify-content:center; padding:56px 0; overflow:hidden; font-family:\'Pretendard\',\'Pretendard Variable\',-apple-system,system-ui,sans-serif;',
      glowStyle: 'position:absolute; inset:0; background:radial-gradient(680px 560px at 50% ' + (phase >= 2 ? '22%' : '50%') + ', rgba(255,255,255,' + (phase >= 2 ? '.10' : '.07') + ') 0%, rgba(255,255,255,0) 68%); transition:background 1s ease;'
    };
  }
}
</script>
</body>
</html>
