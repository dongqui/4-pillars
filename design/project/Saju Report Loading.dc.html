<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  a{color:#4F46E5; text-decoration:none;}
  a:hover{color:#4338CA;}
  ::selection{background:#E0E1FB;}
  @keyframes om-spin{to{transform:rotate(360deg);}}
  @keyframes om-orbit{to{transform:rotate(-360deg);}}
  @keyframes om-breathe{0%,100%{transform:scale(1); opacity:.55;}50%{transform:scale(1.06); opacity:.9;}}
  @keyframes om-rise{0%{opacity:0; transform:translateY(6px);}100%{opacity:1; transform:translateY(0);}}
  @keyframes om-shimmer{0%{background-position:-320px 0;}100%{background-position:320px 0;}}
</style>
</helmet>

<div style="min-height:100vh; background:#F9FAFB; font-family:'Pretendard','Pretendard Variable',-apple-system,system-ui,sans-serif; color:#111827; -webkit-font-smoothing:antialiased; line-height:1.5; display:flex; flex-direction:column;">

  <header style="border-bottom:1px solid #F3F4F6; background:rgba(255,255,255,.86); backdrop-filter:blur(14px);">
    <div style="max-width:640px; margin:0 auto; padding:0 24px; height:64px; display:flex; align-items:center; gap:10px;">
      <div style="width:28px; height:28px; border-radius:9px; background:#111827; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:14px;">사</div>
      <span style="font-weight:600; font-size:15.5px; letter-spacing:-0.02em;">사주</span>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:clamp(32px,6vw,64px) 24px 80px;">
    <div style="width:100%; max-width:520px;">

      <!-- 오브 -->
      <div style="position:relative; width:132px; height:132px; margin:0 auto 34px;">
        <div style="position:absolute; inset:0; border-radius:999px; background:radial-gradient(circle at 50% 45%, rgba(79,70,229,.16), rgba(79,70,229,0) 68%); animation:om-breathe 3.4s ease-in-out infinite;"></div>
        <div style="position:absolute; inset:14px; border-radius:999px; border:1.5px solid #E7E8F5;"></div>
        <div style="position:absolute; inset:14px; border-radius:999px; border:2px solid transparent; border-top-color:#4F46E5; animation:om-spin 1.15s linear infinite;"></div>
        <div style="position:absolute; inset:30px; border-radius:999px; border:1px dashed #DFE1F0; animation:om-orbit 9s linear infinite;"></div>
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; letter-spacing:-0.04em; color:#4F46E5;">{{ pctLabel }}</div>
      </div>

      <!-- 타이틀 -->
      <div style="text-align:center; margin-bottom:34px;">
        <h1 style="font-size:clamp(22px,4vw,27px); font-weight:700; letter-spacing:-0.035em; margin:0 0 10px; text-wrap:balance; white-space:pre-line;">{{ headline }}</h1>
        <p style="font-size:15px; color:#9CA3AF; margin:0;">{{ etaPhrase }}</p>
      </div>

      <!-- 진행 바 -->
      <div style="height:6px; border-radius:999px; background:#EDEFF2; overflow:hidden; margin-bottom:28px;">
        <div style="{{ barStyle }}"></div>
      </div>

      <!-- 단계 -->
      <div style="background:#fff; border:1px solid #EDEFF2; border-radius:20px; padding:8px 22px; box-shadow:0 1px 3px rgba(17,24,39,.04); margin-bottom:20px;">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
          <div style="{{ s.rowStyle }}">
            <span style="{{ s.iconStyle }}">{{ s.icon }}</span>
            <span style="flex:1; min-width:0;">
              <span style="{{ s.labelStyle }}">{{ s.label }}</span>
              <sc-if value="{{ s.showSub }}" hint-placeholder-val="{{ false }}">
                <span style="display:block; font-size:13px; color:#9CA3AF; margin-top:2px; animation:om-rise .32s ease-out;">{{ s.sub }}</span>
              </sc-if>
            </span>
            <sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}">
              <span style="flex:none; font-size:12.5px; font-weight:600; color:#B6BAC1;">완료</span>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
        <button style="font-family:inherit; width:100%; font-size:16px; font-weight:700; color:#fff; background:#4F46E5; border:none; padding:16px; border-radius:14px; cursor:pointer; letter-spacing:-0.01em; box-shadow:0 12px 24px -12px rgba(79,70,229,.7); margin-bottom:20px; animation:om-rise .4s ease-out;" style-hover="opacity:.92;">리포트 보기</button>
      </sc-if>

      <!-- 대기 중 읽을 것 -->
      <div style="background:#fff; border:1px solid #EDEFF2; border-radius:20px; padding:20px 22px; box-shadow:0 1px 3px rgba(17,24,39,.04);">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <span style="width:6px; height:6px; border-radius:999px; background:#4F46E5;"></span>
          <span style="font-size:12px; font-weight:700; letter-spacing:0.04em; color:#4F46E5;">알고 계셨나요</span>
        </div>
        <p style="font-size:15px; color:#374151; line-height:1.7; margin:0; min-height:51px; text-wrap:pretty; animation:om-rise .4s ease-out;" key="{{ tipKey }}">{{ tip }}</p>
        <div style="display:flex; gap:5px; margin-top:14px;">
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
            <span style="{{ d.style }}"></span>
          </sc-for>
        </div>
      </div>

      <p style="font-size:12.5px; color:#B6BAC1; margin:20px 0 0; text-align:center; text-wrap:pretty;">완료되면 등록된 이메일로 알려드려요.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { pct: 4, tipIndex: 0 };

  componentDidMount() {
    this._t = setInterval(() => {
      this.setState(s => {
        const next = Math.min(100, s.pct + (s.pct > 88 ? 0.4 : s.pct > 60 ? 0.9 : 1.6));
        if (next >= 100) { clearInterval(this._t); clearInterval(this._tip); }
        return { pct: next };
      });
    }, 110);
    this._tip = setInterval(() => {
      this.setState(s => ({ tipIndex: s.tipIndex + 1 }));
    }, 4600);
  }
  componentWillUnmount() { clearInterval(this._t); clearInterval(this._tip); }

  renderVals() {
    const ACCENT = '#4F46E5';
    const pct = this.state.pct;

    const stepDefs = [
      { label: '생년월일시로 만세력 변환', sub: '1990년 10월 25일 · 오후 3시 20분', at: 0 },
      { label: '사주 여덟 글자 세우기', sub: '연주 · 월주 · 일주 · 시주 계산 중', at: 18 },
      { label: '오행과 십신 관계 분석', sub: '강한 오행과 부족한 오행을 찾고 있어요', at: 42 },
      { label: '12개 섹션 해석문 작성', sub: '성향 · 관계 · 재물 · 운의 흐름', at: 66 },
      { label: '리포트 구성 마무리', sub: '읽기 좋은 순서로 정리하고 있어요', at: 90 }
    ];

    const activeIdx = stepDefs.reduce((acc, s, i) => (pct >= s.at ? i : acc), 0);
    const steps = stepDefs.map((s, i) => {
      const done = i < activeIdx || pct >= 100;
      const active = i === activeIdx && pct < 100;
      const pending = !done && !active;
      return {
        label: s.label,
        sub: s.sub,
        showSub: active,
        done,
        icon: done ? '✓' : (active ? '' : ''),
        rowStyle: 'display:flex; align-items:flex-start; gap:13px; padding:15px 0;' + (i < stepDefs.length - 1 ? ' border-bottom:1px solid #F6F7F8;' : ''),
        iconStyle: 'flex:none; width:22px; height:22px; margin-top:1px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; ' + (done
          ? 'background:' + ACCENT + '; color:#fff;'
          : active
            ? 'background:#fff; color:transparent; border:2px solid ' + ACCENT + '; border-top-color:transparent; animation:om-spin .9s linear infinite;'
            : 'background:#F0F1F3; border:1px solid #EDEFF2;'),
        labelStyle: 'display:block; font-size:15px; letter-spacing:-0.01em; font-weight:' + (pending ? '500' : '600') + '; color:' + (pending ? '#B6BAC1' : '#111827') + ';'
      };
    });

    const tips = [
      '사주는 태어난 순간의 기운을 여덟 글자로 옮긴 기록이에요. 정해진 운명이 아니라, 타고난 성향과 흐름을 읽는 지도에 가깝습니다.',
      '태어난 시간을 모르면 시주(時柱)를 세울 수 없어요. 시간을 아는 것만으로 해석의 정확도가 크게 올라갑니다.',
      '오행이 완벽하게 균형 잡힌 사주는 드물어요. 부족한 기운을 어떻게 채우는지가 사주 해석의 핵심입니다.',
      '대운은 10년 단위로 바뀌는 큰 흐름이에요. 같은 사주라도 지금 어느 대운에 있는지에 따라 다르게 읽힙니다.'
    ];
    const tipIdx = this.state.tipIndex % tips.length;
    const dots = tips.map((_, i) => ({
      style: 'width:' + (i === tipIdx ? '18px' : '6px') + '; height:6px; border-radius:999px; transition:width .3s ease, background .3s ease; background:' + (i === tipIdx ? ACCENT : '#E5E7EB') + ';'
    }));

    const remain = Math.max(3, Math.round((100 - pct) * 0.28));

    return {
      isDone: pct >= 100,
      headline: pct >= 100 ? '김동진님의 리포트가\n완성됐어요' : '김동진님의 리포트를\n만들고 있어요',
      etaPhrase: pct >= 100 ? '12개 섹션 전체를 확인할 수 있어요' : '약 ' + remain + '초 남았어요 · 창을 닫아도 계속 진행됩니다',
      pctLabel: Math.floor(pct) + '%',
      barStyle: 'height:100%; border-radius:999px; width:' + pct + '%; transition:width .22s linear; background:linear-gradient(90deg,' + ACCENT + ',#7C74F0);',
      steps,
      tip: tips[tipIdx],
      tipKey: 'tip-' + tipIdx,
      dots
    };
  }
}
</script>
</body>
</html>
